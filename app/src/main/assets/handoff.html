<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handed off</title>
<style>
  :root { --pre-bg: #f5f5f5; --border: #ddd; }
  @media (prefers-color-scheme: dark) {
    body { background: #121212; color: #e0e0e0; }
    :root { --pre-bg: #1e1e1e; --border: #3a3a3a; }
  }
  body { font-family: sans-serif; margin: 0; padding: 2rem; max-width: 42rem; margin-inline: auto; line-height: 1.6; }
  h1 { font-size: 1.3rem; }
  .ok { color: #0f766e; font-weight: 600; }
  code { background: var(--pre-bg); border: 1px solid var(--border); border-radius: 4px; padding: 0.1em 0.4em; }
</style>
</head>
<body>
<h1><span class="ok">&#10003;</span> Code handed off</h1>
<p>The access code was sent to your share target. The rest of the login
(exchange and verification) completes on the gateway server.</p>
<p>Nothing else is needed here. You can navigate away, or dismiss the banner
above whenever you like.</p>
</body>
</html>
